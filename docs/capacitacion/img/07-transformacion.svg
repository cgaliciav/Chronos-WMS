<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" width="900" height="385" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Transformación: unidades de un artículo se convierten en uno o más artículos nuevos">
<title>Transformación: unidades de un artículo se convierten en uno o más artículos nuevos</title>
<defs><marker id="f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker><marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker><marker id="f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e22ce"/></marker></defs>
<rect width="900" height="385" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="450" y="40" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700">Transformación: un artículo se convierte en otros</text>
<rect x="40" y="120" width="240" height="120" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="160.0" y="167" font-size="16" fill="#b45309" text-anchor="middle" font-weight="700">ARTÍCULO ORIGINAL</text>
<text x="160.0" y="190" font-size="13" fill="#0f172a" text-anchor="middle">La producción tiene 5</text>
<text x="160.0" y="206" font-size="13" fill="#0f172a" text-anchor="middle">y usa 2 para construir algo</text>
<rect x="600" y="80" width="260" height="80" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="730.0" y="115" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="700">ARTÍCULO NUEVO A</text>
<text x="730.0" y="136" font-size="13" fill="#0f172a" text-anchor="middle">con su propia clave</text>
<rect x="600" y="200" width="260" height="80" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="730.0" y="235" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="700">ARTÍCULO NUEVO B</text>
<text x="730.0" y="256" font-size="13" fill="#0f172a" text-anchor="middle">con su propia clave</text>
<path d="M280 160L596 120" fill="none" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#f5)"/>
<text x="438.0" y="128" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">se transforma</text>
<path d="M280 200L596 240" fill="none" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#f5)"/>
<text x="160" y="270" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">Le quedan 3 al original</text>
<text x="730" y="310" font-size="13" fill="#0f172a" text-anchor="middle">Quedan a cargo de la misma producción</text>
<text x="730" y="327" font-size="13" fill="#0f172a" text-anchor="middle">(como una compra) y ligados al original</text>
<text x="450" y="366" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700">Una transformación no se puede deshacer: revisa bien antes de guardar.</text>
</svg>
