<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Un listado es una hoja: encabezado con proyecto y responsables, y un renglón por movimiento">
<title>Un listado es una hoja: encabezado con proyecto y responsables, y un renglón por movimiento</title>
<defs><marker id="f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker><marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker><marker id="f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e22ce"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="450" y="40" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700">Un listado es como una hoja de papel</text>
<rect x="250" y="70" width="400" height="360" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<rect x="250" y="70" width="400" height="110" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="270" y="98" font-size="16" fill="#1d4ed8" text-anchor="start" font-weight="700">Listado: EN-UTILERÍA-P1</text>
<text x="270" y="122" font-size="14" fill="#0f172a" text-anchor="start">Tipo: PRÉSTAMO</text>
<text x="270" y="144" font-size="14" fill="#0f172a" text-anchor="start">Proyecto: EL NEGRO</text>
<text x="270" y="166" font-size="14" fill="#0f172a" text-anchor="start">Responsables: quien recibe los artículos</text>
<text x="270" y="208" font-size="13" fill="#475569" text-anchor="start" font-weight="700">Clave</text>
<text x="380" y="208" font-size="13" fill="#475569" text-anchor="start" font-weight="700">Producto</text>
<text x="630" y="208" font-size="13" fill="#475569" text-anchor="end" font-weight="700">Cantidad</text>
<line x1="262" y1="216" x2="638" y2="216" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="262" y="224" width="376" height="34" rx="6" fill="#f8fafc" stroke="none"/>
<text x="270" y="246" font-size="14" fill="#0f172a" text-anchor="start">0000005747</text>
<text x="380" y="246" font-size="14" fill="#0f172a" text-anchor="start">ANTEOJOS</text>
<text x="630" y="246" font-size="14" fill="#0f172a" text-anchor="end" font-weight="700">3</text>
<rect x="262" y="268" width="376" height="34" rx="6" fill="#fef3c7" stroke="none"/>
<text x="270" y="290" font-size="14" fill="#0f172a" text-anchor="start">0000005662</text>
<text x="380" y="290" font-size="14" fill="#0f172a" text-anchor="start">VASOS CHICOS Y LARGOS</text>
<text x="630" y="290" font-size="14" fill="#0f172a" text-anchor="end" font-weight="700">10</text>
<rect x="262" y="312" width="376" height="34" rx="6" fill="#f8fafc" stroke="none"/>
<text x="270" y="334" font-size="14" fill="#0f172a" text-anchor="start">0000005536</text>
<text x="380" y="334" font-size="14" fill="#0f172a" text-anchor="start">VELAS LED</text>
<text x="630" y="334" font-size="14" fill="#0f172a" text-anchor="end" font-weight="700">4</text>
<text x="450" y="400" font-size="13" fill="#475569" text-anchor="middle" font-style="italic">…un renglón por cada artículo</text>
<path d="M205 125L246 125" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#f1)"/>
<text x="120" y="110" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">ENCABEZADO</text>
<text x="120" y="132" font-size="13" fill="#0f172a" text-anchor="middle">Se llena una vez,</text>
<text x="120" y="149" font-size="13" fill="#0f172a" text-anchor="middle">al crear el listado</text>
<path d="M695 290L642 290" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#f2)"/>
<text x="780" y="276" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">MOVIMIENTO</text>
<text x="780" y="298" font-size="13" fill="#0f172a" text-anchor="middle">Un renglón.</text>
<text x="780" y="315" font-size="13" fill="#0f172a" text-anchor="middle">Se agrega al escanear</text>
<text x="780" y="332" font-size="13" fill="#0f172a" text-anchor="middle">la clave del artículo</text>
<text x="450" y="455" font-size="14" fill="#475569" text-anchor="middle">Todos los renglones de una hoja son del mismo tipo, del mismo proyecto y de los mismos responsables.</text>
</svg>
