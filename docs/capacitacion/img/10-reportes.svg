<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Los reportes se piden, esperan en fila, se generan uno a la vez y llegan por correo">
<title>Los reportes se piden, esperan en fila, se generan uno a la vez y llegan por correo</title>
<defs><marker id="f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker><marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker><marker id="f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e22ce"/></marker></defs>
<rect width="900" height="290" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="450" y="40" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700">¿Cómo llega un reporte?</text>
<rect x="24" y="90" width="196" height="120" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="122.0" y="136" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">PIDO EL REPORTE</text>
<text x="122.0" y="158" font-size="13" fill="#0f172a" text-anchor="middle">Botón «Reportes»</text>
<text x="122.0" y="175" font-size="13" fill="#0f172a" text-anchor="middle">en el listado</text>
<circle cx="28" cy="92" r="16" fill="#1d4ed8"/>
<text x="28" y="98" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<path d="M222 150L240 150" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#f0)"/>
<rect x="242" y="90" width="196" height="120" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="340.0" y="136" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">ESPERA SU TURNO</text>
<text x="340.0" y="158" font-size="13" fill="#0f172a" text-anchor="middle">Se genera un reporte</text>
<text x="340.0" y="175" font-size="13" fill="#0f172a" text-anchor="middle">a la vez</text>
<circle cx="246" cy="92" r="16" fill="#b45309"/>
<text x="246" y="98" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<path d="M440 150L458 150" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#f0)"/>
<rect x="460" y="90" width="196" height="120" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="558.0" y="145" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="700">SE GENERA EL EXCEL</text>
<text x="558.0" y="166" font-size="13" fill="#0f172a" text-anchor="middle">Con foto tarda más</text>
<circle cx="464" cy="92" r="16" fill="#7e22ce"/>
<text x="464" y="98" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<path d="M658 150L676 150" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#f0)"/>
<rect x="678" y="90" width="196" height="120" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="776.0" y="136" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">ME AVISA</text>
<text x="776.0" y="158" font-size="13" fill="#0f172a" text-anchor="middle">Campana del sistema</text>
<text x="776.0" y="175" font-size="13" fill="#0f172a" text-anchor="middle">y correo con el archivo</text>
<circle cx="682" cy="92" r="16" fill="#15803d"/>
<text x="682" y="98" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="450" y="255" font-size="14" fill="#475569" text-anchor="middle">Puedes seguir trabajando mientras tanto: no hace falta esperar con la pantalla abierta.</text>
</svg>
