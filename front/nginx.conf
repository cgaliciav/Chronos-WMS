# Servidor del contenedor `frontend` (nginx:1.25-alpine) que sirve front-www/ (el build de Vite).
# Se monta como /etc/nginx/conf.d/default.conf. Desde v4.1.0 el front usa rutas sin `#` (`/catalogo/general`):
# cualquier ruta que no sea un archivo debe devolver index.html para que la resuelva el router del navegador.
# Sirve también los builds antiguos con hash routing (rollback seguro).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # index.html nunca se cachea: así cada despliegue carga los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash en el nombre (Vite): caché larga. Si no existen, 404 (no index.html).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
